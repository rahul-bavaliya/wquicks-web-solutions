name = "wquicks-backend"
main = "src/index.ts"
compatibility_date = "2024-12-18"

[env.dev]
name = "dev-wquicks-backend"
routes = [
  { pattern = "api.dev.wquicks.com", custom_domain = true }
]

[env.dev.vars]
ALLOWED_ORIGIN = "https://dev.wquicks.com"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "wquicks-db-dev"
database_id = "51ec630b-db65-447d-a6a4-639f1bbf0a9d"

[[env.dev.r2_buckets]]
binding = "CONTRACTS"
bucket_name = "wquicks-contracts-dev"

[env.uat]
name = "uat-wquicks-backend"
routes = [
  { pattern = "api.uat.wquicks.com", custom_domain = true }
]

[env.uat.vars]
ALLOWED_ORIGIN = "https://uat.wquicks.com"

[[env.uat.d1_databases]]
binding = "DB"
database_name = "wquicks-db-uat"
database_id = "c49cc8b3-3195-4aaa-8ca3-6b17a2fd14b7"

[[env.uat.r2_buckets]]
binding = "CONTRACTS"
bucket_name = "wquicks-contracts-uat"

[env.prod]
name = "prod-wquicks-backend"
routes = [
  { pattern = "api.wquicks.com", custom_domain = true }
]

[env.prod.vars]
ALLOWED_ORIGIN = "https://wquicks.com"

[[env.prod.d1_databases]]
binding = "DB"
database_name = "wquicks-db-prod"
database_id = "602210d8-3ae4-443b-90c7-df569d3f6805"

[[env.prod.r2_buckets]]
binding = "CONTRACTS"
bucket_name = "wquicks-contracts-prod"

